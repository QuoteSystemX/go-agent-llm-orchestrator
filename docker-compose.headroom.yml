services:
  headroom-proxy:
    image: python:3.12-slim
    command: >
      sh -c "pip install 'headroom-ai[proxy]>=0.23.0' --quiet &&
             headroom proxy --port 8787 --upstream-url http://host.docker.internal:11434"
    ports:
      - "8787:8787"
    environment:
      HEADROOM_CONFIG_DIR: /workspace/.headroom
      HEADROOM_WORKSPACE_DIR: /workspace
      HEADROOM_STORE_URL: "redis://redis:6379/0"
      HEADROOM_MODE: OPTIMIZE
      HEADROOM_QDRANT_URL: "http://qdrant:6333"
    volumes:
      - .:/workspace
      - headroom_cache:/workspace/.headroom
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8787/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.17.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  headroom_cache:
  redis_data:
  qdrant_data:
