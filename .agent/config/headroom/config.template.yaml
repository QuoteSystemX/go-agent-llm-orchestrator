version: "1"
store_url: "sqlite:///${workspace}/.headroom/cache.db"
default_mode: OPTIMIZE

compression:
  smart_crusher:
    enabled: true
    max_items_after_crush: 15
    min_tokens_to_crush: 200
    variance_threshold: 2.0
    toin_confidence_threshold: 0.3
  cache_aligner:
    use_dynamic_detector: true
    entropy_threshold: 0.7
    normalize_whitespace: true
  relevance_scorer:
    mode: hybrid

output_buffer_tokens: 4000
intercept_tool_results: true

bus_integration:
  ccr_threshold_tokens: 500
  enabled: true
