version: "1"
store_url: "sqlite:///${workspace}/.headroom/cache.db"
default_mode: OPTIMIZE

compression:
  smart_crusher:
    enabled: true
    max_items_after_crush: 5
    min_tokens_to_crush: 100
    variance_threshold: 3.0
    toin_confidence_threshold: 0.3
  code_compressor:
    enabled: true
    languages: [python, sql, yaml, json]
    preserve_docstrings: false
  cache_aligner:
    use_dynamic_detector: true
    entropy_threshold: 0.8
  relevance_scorer:
    mode: embedding

output_buffer_tokens: 6000
intercept_tool_results: true

bus_integration:
  ccr_threshold_tokens: 300
  enabled: true

waste_signals:
  - dataframe_repr
  - training_log_trim
  - json_verbosity
